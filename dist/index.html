<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filesystem Debugger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .debugger-header {
      background: #2a2a2a;
      padding: 15px;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .debugger-title {
      font-weight: bold;
      color: #4ade80;
      font-size: 16px;
    }
    .debugger-controls button {
      background: #3a3a3a;
      border: none;
      color: #e0e0e0;
      padding: 8px 16px;
      margin-left: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .debugger-controls button:hover {
      background: #4a4a4a;
    }
    .debugger-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 300px;
      background: #242424;
      border-right: 1px solid #3a3a3a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .sidebar-section h3 {
      color: #4ade80;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .layer-item {
      background: #2a2a2a;
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 6px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    .layer-item:hover {
      background: #333;
      border-left-color: #4ade80;
    }
    .layer-item.active {
      background: #3a3a3a;
      border-left-color: #4ade80;
    }
    .layer-hash {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #64b5f6;
      margin-bottom: 4px;
    }
    .layer-timestamp {
      font-size: 11px;
      color: #999;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .status-card {
      background: #242424;
      padding: 18px;
      border-radius: 10px;
      border-left: 4px solid #4ade80;
    }
    .status-card.warning {
      border-left-color: #ffbd2e;
    }
    .status-card.error {
      border-left-color: #ff5f56;
    }
    .status-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .status-value {
      font-size: 24px;
      font-weight: bold;
      color: #4ade80;
    }
    .file-list {
      background: #242424;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .file-list h3 {
      color: #4ade80;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .file-item {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 8px 10px;
      margin: 4px 0;
      background: #2a2a2a;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-item.added {
      border-left: 3px solid #4ade80;
    }
    .file-item.modified {
      border-left: 3px solid #ffbd2e;
    }
    .file-item.deleted {
      border-left: 3px solid #ff5f56;
      text-decoration: line-through;
      opacity: 0.7;
    }
    .file-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .file-badge.added {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }
    .file-badge.modified {
      background: rgba(255, 189, 46, 0.2);
      color: #ffbd2e;
    }
    .file-badge.deleted {
      background: rgba(255, 95, 86, 0.2);
      color: #ff5f56;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .sidebar-section::-webkit-scrollbar,
    .content-area::-webkit-scrollbar {
      width: 8px;
    }
    .sidebar-section::-webkit-scrollbar-track,
    .content-area::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .sidebar-section::-webkit-scrollbar-thumb,
    .content-area::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }
    .layer-checkout-btn {
      background: #4ade80;
      color: #1a1a1a;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      transition: background 0.2s;
    }
    .layer-checkout-btn:hover {
      background: #22c55e;
    }
    .layer-checkout-btn:active {
      background: #16a34a;
    }
    .layer-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .layer-controls button {
      flex: 1;
      background: #3a3a3a;
      border: none;
      color: #e0e0e0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .layer-controls button:hover {
      background: #4a4a4a;
    }
    .compare-btn {
      background: #64b5f6 !important;
      color: #1a1a1a !important;
    }
    .compare-btn:hover {
      background: #42a5f5 !important;
    }
    .layer-item.selected-compare {
      border-left-color: #64b5f6;
      background: #3a4a5a;
    }
    .diff-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .diff-modal.active {
      display: flex;
    }
    .diff-container {
      background: #1e1e1e;
      margin: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: calc(100% - 40px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .diff-header {
      padding: 20px;
      border-bottom: 1px solid #3a3a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .diff-header h3 {
      color: #e0e0e0;
      font-size: 16px;
      margin: 0;
    }
    .diff-close-btn {
      background: #3a3a3a;
      border: none;
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .diff-close-btn:hover {
      background: #4a4a4a;
    }
    .diff-content {
      flex: 1;
      overflow: auto;
      padding: 20px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .diff-file-header {
      color: #64b5f6;
      font-weight: bold;
      padding: 10px 0;
      margin-top: 15px;
      border-bottom: 1px solid #3a3a3a;
    }
    .diff-file-header:first-child {
      margin-top: 0;
    }
    .diff-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .diff-side {
      background: #252525;
      border-radius: 4px;
      overflow: hidden;
    }
    .diff-side-label {
      background: #2a2a2a;
      padding: 8px 12px;
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #3a3a3a;
    }
    .diff-lines {
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    .diff-line {
      display: flex;
      padding: 2px 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .diff-line-added {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
    }
    .diff-line-removed {
      background: rgba(255, 95, 86, 0.15);
      color: #ff5f56;
    }
    .diff-line-unchanged {
      color: #b0b0b0;
    }
    .diff-summary {
      background: #242424;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .diff-stat {
      display: inline-block;
      margin-right: 20px;
      font-size: 13px;
    }
    .diff-stat-added {
      color: #4ade80;
    }
    .diff-stat-modified {
      color: #ffbd2e;
    }
    .diff-stat-deleted {
      color: #ff5f56;
    }
    .debug-log {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #242424;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      max-width: 400px;
      z-index: 9999;
      animation: slideIn 0.3s;
    }
    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .debug-log.success {
      border-color: #4ade80;
      color: #4ade80;
    }
    .debug-log.error {
      border-color: #ff5f56;
      color: #ff5f56;
    }
    .debug-log.info {
      border-color: #64b5f6;
      color: #64b5f6;
    }
    .compare-mode-active {
      background: #3a4a5a;
      border: 1px dashed #64b5f6;
    }
  </style>
</head>
<body>
  <div class="debugger-header">
    <div class="debugger-title">🔍 Filesystem Debugger</div>
    <div class="debugger-controls">
      <button id="compareBtn" onclick="toggleCompareMode()">Compare Layers</button>
      <button onclick="refreshData()">Refresh</button>
      <button onclick="showTags()">Tags</button>
      <button onclick="showCreateTagDialog()" style="background: #4ade80; color: #1a1a1a;">Create Tag</button>
    </div>
  </div>
  <div class="debugger-main">
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Layer History</h3>
        <div id="layers"></div>
      </div>
    </div>
    <div class="content-area" id="content">
      <div class="empty-state">
        <h3>Select a layer to view details</h3>
        <p>or view current status below</p>
      </div>
    </div>
  </div>

  <div id="diffModal" class="diff-modal">
    <div class="diff-container">
      <div class="diff-header">
        <h3 id="diffTitle">File Diff Viewer</h3>
        <button class="diff-close-btn" onclick="closeDiffModal()">Close</button>
      </div>
      <div class="diff-content" id="diffContent"></div>
    </div>
  </div>

  <script>
    // [Storage-Manager-Injected]

function createStorageManager(appId) {
  const stateKey = `app-state:${appId}`;
  const expiryKey = `app-state-expiry:${appId}`;
  return {
    save(state, ttlMs = null) {
      try {
        localStorage.setItem(stateKey, JSON.stringify(state));
        if (ttlMs) {
          const expiryTime = Date.now() + ttlMs;
          localStorage.setItem(expiryKey, expiryTime.toString());
        }
      } catch (error) {
        console.error(`[Storage] Failed to save state for ${appId}:`, error);
      }
    },
    load() {
      try {
        const expiryTime = localStorage.getItem(expiryKey);
        if (expiryTime && Date.now() > parseInt(expiryTime)) {
          this.clear();
          return null;
        }
        const stateStr = localStorage.getItem(stateKey);
        return stateStr ? JSON.parse(stateStr) : null;
      } catch (error) {
        console.error(`[Storage] Failed to load state for ${appId}:`, error);
        return null;
      }
    },
    clear() {
      try {
        localStorage.removeItem(stateKey);
        localStorage.removeItem(expiryKey);
      } catch (error) {
        console.error(`[Storage] Failed to clear state for ${appId}:`, error);
      }
    }
  };
}

    const storage = createStorageManager('app-debugger');
    const savedState = storage.load();
    if (savedState) {
      selectedLayer = savedState.selectedLayer || selectedLayer;
      expandedLayers = savedState.expandedLayers || expandedLayers;
    }
    window.addEventListener('beforeunload', () => {
      storage.save({ selectedLayer, expandedLayers });
    });
  

    let currentLayers = [];
    let selectedLayer = null;
    let comparisonMode = false;
    let selectedLayers = [];

    function addDebugLog(message, type = 'info') {
      const log = document.createElement('div');
      log.className = `debug-log ${type}`;
      log.textContent = message;
      document.body.appendChild(log);
      setTimeout(() => {
        log.style.opacity = '0';
        log.style.transition = 'opacity 0.3s';
        setTimeout(() => log.remove(), 300);
      }, 3000);
    }

    function toggleCompareMode() {
      comparisonMode = !comparisonMode;
      selectedLayers = [];
      selectedLayer = null;
      const btn = document.getElementById('compareBtn');
      if (comparisonMode) {
        btn.style.background = '#64b5f6';
        btn.style.color = '#1a1a1a';
        addDebugLog('Compare mode enabled. Select two layers to compare.', 'info');
      } else {
        btn.style.background = '';
        btn.style.color = '';
        addDebugLog('Compare mode disabled.', 'info');
      }
      renderLayers(currentLayers);
    }

    async function refreshData() {
      await Promise.all([loadLayers(), loadStatus()]);
    }

    async function loadLayers() {
      try {
        const res = await fetch('/api/sequential-os/history');
        const layers = await res.json();
        currentLayers = layers;
        renderLayers(layers);
      } catch (error) {
        console.error('Failed to load layers:', error);
        addDebugLog('Failed to load layers', 'error');
      }
    }

    async function loadStatus() {
      try {
        const res = await fetch('/api/sequential-os/status');
        const status = await res.json();
        renderStatus(status);
      } catch (error) {
        console.error('Failed to load status:', error);
      }
    }

    function renderLayers(layers) {
      const container = document.getElementById('layers');
      if (layers.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No layers yet</p></div>';
        return;
      }

      container.innerHTML = layers.map((layer, idx) => `
        <div class="layer-item ${selectedLayer === idx ? 'active' : ''} ${selectedLayers.includes(idx) ? 'selected-compare' : ''}" onclick="selectLayer(${idx})">
          <div class="layer-hash">${escapeHtml(layer.short)}</div>
          <div class="layer-timestamp">${new Date(layer.time).toLocaleString()}</div>
          ${!comparisonMode ? `
            <button class="layer-checkout-btn" onclick="event.stopPropagation(); checkoutLayer('${escapeHtml(layer.hash)}')">
              Checkout
            </button>
          ` : ''}
          ${!comparisonMode && selectedLayers.length < 2 ? `
            <div class="layer-controls">
              ${currentLayers.length > 1 ? `<button onclick="event.stopPropagation(); compareWithNext('${idx}')" class="compare-btn">Compare</button>` : ''}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function checkoutLayer(hash) {
      try {
        addDebugLog('Checking out layer...', 'info');
        const res = await fetch('/api/sequential-os/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ref: hash })
        });
        const result = await res.json();
        if (result.success || result.ref) {
          addDebugLog(`Checked out layer ${hash.substring(0, 8)}`, 'success');
          await Promise.all([loadLayers(), loadStatus()]);
        } else {
          addDebugLog(`Checkout failed: ${result.error || 'Unknown error'}`, 'error');
        }
      } catch (error) {
        addDebugLog(`Checkout error: ${error.message}`, 'error');
      }
    }

    function compareWithNext(idxStr) {
      const idx = parseInt(idxStr);
      if (selectedLayers.includes(idx)) {
        selectedLayers = selectedLayers.filter(i => i !== idx);
      } else if (selectedLayers.length < 2) {
        selectedLayers.push(idx);
      }
      if (selectedLayers.length === 2) {
        showLayerComparison(selectedLayers[0], selectedLayers[1]);
      }
      renderLayers(currentLayers);
    }

    function renderStatus(status) {
      const content = document.getElementById('content');
      const added = status.added || [];
      const modified = status.modified || [];
      const deleted = status.deleted || [];
      const total = added.length + modified.length + deleted.length;

      content.innerHTML = `
        <h2 style="margin-bottom: 20px; color: #4ade80;">Current Status</h2>
        <div class="status-grid">
          <div class="status-card">
            <div class="status-label">Total Changes</div>
            <div class="status-value">${total}</div>
          </div>
          <div class="status-card ${added.length > 0 ? '' : 'warning'}">
            <div class="status-label">Added Files</div>
            <div class="status-value">${added.length}</div>
          </div>
          <div class="status-card ${modified.length > 0 ? 'warning' : ''}">
            <div class="status-label">Modified Files</div>
            <div class="status-value">${modified.length}</div>
          </div>
          <div class="status-card ${deleted.length > 0 ? 'error' : ''}">
            <div class="status-label">Deleted Files</div>
            <div class="status-value">${deleted.length}</div>
          </div>
        </div>
        ${added.length > 0 ? `
          <div class="file-list">
            <h3>Added Files</h3>
            ${added.map(f => `
              <div class="file-item added">
                <span>${escapeHtml(f)}</span>
                <span class="file-badge added">Added</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${modified.length > 0 ? `
          <div class="file-list">
            <h3>Modified Files</h3>
            ${modified.map(f => `
              <div class="file-item modified">
                <span>${escapeHtml(f)}</span>
                <span class="file-badge modified">Modified</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${deleted.length > 0 ? `
          <div class="file-list">
            <h3>Deleted Files</h3>
            ${deleted.map(f => `
              <div class="file-item deleted">
                <span>${escapeHtml(f)}</span>
                <span class="file-badge deleted">Deleted</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
        ${total === 0 ? '<div class="empty-state"><h3>✓ Working directory clean</h3><p>No uncommitted changes</p></div>' : ''}
      `;
    }

    async function selectLayer(idx) {
      if (comparisonMode) {
        if (selectedLayers.includes(idx)) {
          selectedLayers = selectedLayers.filter(i => i !== idx);
        } else if (selectedLayers.length < 2) {
          selectedLayers.push(idx);
        }
        if (selectedLayers.length === 2) {
          showLayerComparison(selectedLayers[0], selectedLayers[1]);
        }
        renderLayers(currentLayers);
      } else {
        selectedLayer = idx;
        renderLayers(currentLayers);
        const layer = currentLayers[idx];

        try {
          const res = await fetch(`/api/sequential-os/inspect/${layer.hash}`);
          const info = await res.json();

          const content = document.getElementById('content');
          content.innerHTML = `
            <h2 style="margin-bottom: 20px; color: #4ade80;">Layer Details</h2>
            <div class="status-grid">
              <div class="status-card">
                <div class="status-label">Hash</div>
                <div class="status-value" style="font-size: 14px; font-family: 'Courier New', monospace;">${escapeHtml(layer.hash)}</div>
              </div>
              <div class="status-card">
                <div class="status-label">Short Hash</div>
                <div class="status-value" style="font-size: 18px;">${escapeHtml(layer.short)}</div>
              </div>
              <div class="status-card">
                <div class="status-label">Timestamp</div>
                <div class="status-value" style="font-size: 16px;">${new Date(layer.time).toLocaleString()}</div>
              </div>
              <div class="status-card">
                <div class="status-label">Size</div>
                <div class="status-value">${(info.size / 1024).toFixed(2)} KB</div>
              </div>
            </div>
            ${info.files && info.files.length > 0 ? `
              <div class="file-list">
                <h3>Files in this Layer (${info.files.length})</h3>
                ${info.files.map(f => `
                  <div class="file-item">
                    <span>${escapeHtml(f)}</span>
                  </div>
                `).join('')}
              </div>
            ` : '<div class="empty-state"><p>No files in this layer</p></div>'}
          `;
        } catch (error) {
          console.error('Failed to inspect layer:', error);
        }
      }
    }

    async function showTags() {
      try {
        const res = await fetch('/api/sequential-os/tags');
        const tags = await res.json();
        const content = document.getElementById('content');

        const tagEntries = Object.entries(tags);
        content.innerHTML = `
          <h2 style="margin-bottom: 20px; color: #4ade80;">Tags</h2>
          ${tagEntries.length > 0 ? `
            <div class="file-list">
              ${tagEntries.map(([name, ref]) => `
                <div class="file-item">
                  <span style="font-weight: bold; color: #4ade80;">${escapeHtml(name)}</span>
                  <span style="font-family: 'Courier New', monospace; font-size: 12px; color: #64b5f6;">${escapeHtml(ref)}</span>
                </div>
              `).join('')}
            </div>
          ` : '<div class="empty-state"><h3>No tags yet</h3><p>Create tags to bookmark important states</p></div>'}
        `;
      } catch (error) {
        console.error('Failed to load tags:', error);
      }
    }

    async function showCreateTagDialog() {
      const tagName = prompt('Enter tag name:');
      if (!tagName || !tagName.trim()) return;

      let refHash = null;
      if (selectedLayer !== null && currentLayers[selectedLayer]) {
        refHash = currentLayers[selectedLayer].hash;
      } else if (currentLayers.length > 0) {
        refHash = currentLayers[currentLayers.length - 1].hash;
      }

      if (!refHash) {
        const manualRef = prompt('No layer selected. Enter hash manually (or cancel):');
        if (!manualRef) return;
        refHash = manualRef;
      }

      try {
        addDebugLog(`Creating tag "${tagName.trim()}"...`, 'info');
        const res = await fetch('/api/sequential-os/tag', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: tagName.trim(), ref: refHash })
        });
        const result = await res.json();
        if (result.success) {
          addDebugLog(`Tag "${tagName.trim()}" created for ${refHash.substring(0, 8)}`, 'success');
          await showTags();
        } else {
          addDebugLog(`Failed to create tag: ${result.error}`, 'error');
        }
      } catch (error) {
        addDebugLog(`Error creating tag: ${error.message}`, 'error');
      }
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function closeDiffModal() {
      const modal = document.getElementById('diffModal');
      modal.classList.remove('active');
    }

    function computeSimpleDiff(oldText, newText) {
      const oldLines = oldText.split('\n');
      const newLines = newText.split('\n');
      const added = [];
      const removed = [];
      const maxLen = Math.max(oldLines.length, newLines.length);

      for (let i = 0; i < maxLen; i++) {
        const oldLine = oldLines[i];
        const newLine = newLines[i];
        if (oldLine !== newLine) {
          if (oldLine !== undefined) removed.push({ line: oldLine, idx: i });
          if (newLine !== undefined) added.push({ line: newLine, idx: i });
        }
      }

      return { added, removed, oldLines, newLines };
    }

    async function showLayerComparison(idx1, idx2) {
      const layer1 = currentLayers[idx1];
      const layer2 = currentLayers[idx2];

      addDebugLog('Loading layer comparison...', 'info');

      try {
        const [res1, res2] = await Promise.all([
          fetch(`/api/sequential-os/inspect/${layer1.hash}`),
          fetch(`/api/sequential-os/inspect/${layer2.hash}`)
        ]);

        const info1 = await res1.json();
        const info2 = await res2.json();

        const files1 = new Set(info1.files || []);
        const files2 = new Set(info2.files || []);

        const added = [...files2].filter(f => !files1.has(f));
        const deleted = [...files1].filter(f => !files2.has(f));
        const modified = [...files1].filter(f => files2.has(f));

        document.getElementById('diffTitle').textContent = `Comparing ${escapeHtml(layer1.short)} → ${escapeHtml(layer2.short)}`;

        let diffHtml = `
          <div class="diff-summary">
            <div class="diff-stat diff-stat-added">+ ${added.length} added</div>
            <div class="diff-stat diff-stat-modified">~ ${modified.length} modified</div>
            <div class="diff-stat diff-stat-deleted">- ${deleted.length} deleted</div>
          </div>
        `;

        if (added.length > 0) {
          diffHtml += `<div class="diff-file-header">Added Files (${added.length})</div>`;
          added.forEach(file => {
            diffHtml += `<div class="diff-line" style="color: #4ade80; padding: 4px 8px; background: rgba(74, 222, 128, 0.1); margin: 4px 0;">+ ${escapeHtml(file)}</div>`;
          });
        }

        if (deleted.length > 0) {
          diffHtml += `<div class="diff-file-header">Deleted Files (${deleted.length})</div>`;
          deleted.forEach(file => {
            diffHtml += `<div class="diff-line" style="color: #ff5f56; padding: 4px 8px; background: rgba(255, 95, 86, 0.1); margin: 4px 0;">- ${escapeHtml(file)}</div>`;
          });
        }

        if (modified.length > 0) {
          diffHtml += `<div class="diff-file-header">Modified Files (${modified.length})</div>`;
          modified.slice(0, 10).forEach(file => {
            diffHtml += `<div class="diff-line" style="color: #ffbd2e; padding: 4px 8px; background: rgba(255, 189, 46, 0.1); margin: 4px 0; cursor: pointer;" onclick="showFileDiffDetails('${escapeHtml(file)}', '${escapeHtml(layer1.hash)}', '${escapeHtml(layer2.hash)}')">~ ${escapeHtml(file)}</div>`;
          });
          if (modified.length > 10) {
            diffHtml += `<div style="color: #999; padding: 8px; text-align: center;">... and ${modified.length - 10} more modified files</div>`;
          }
        }

        document.getElementById('diffContent').innerHTML = diffHtml;
        document.getElementById('diffModal').classList.add('active');
        addDebugLog('Comparison loaded successfully', 'success');
      } catch (error) {
        addDebugLog(`Failed to compare layers: ${error.message}`, 'error');
        console.error('Failed to compare layers:', error);
      }
    }

    async function showFileDiffDetails(filePath, hash1, hash2) {
      addDebugLog('Loading file diff...', 'info');
      try {
        const res = await fetch('/api/sequential-os/diff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file: filePath, hash1, hash2 })
        });
        const data = await res.json();

        if (data.error) {
          document.getElementById('diffContent').innerHTML = `<div style="text-align: center; padding: 40px; color: #ff5f56;">
            <p>Error loading diff: ${escapeHtml(data.error)}</p>
          </div>`;
          return;
        }

        const lines1 = data.content1.split('\n');
        const lines2 = data.content2.split('\n');

        const diff = computeDetailedDiff(lines1, lines2);

        let diffHtml = `
          <div class="diff-file-header">${escapeHtml(filePath)}</div>
          <div class="diff-summary">
            <div class="diff-stat diff-stat-added">+ ${diff.added.length} lines added</div>
            <div class="diff-stat diff-stat-deleted">- ${diff.removed.length} lines removed</div>
          </div>
          <div class="diff-section">
            <div class="diff-side">
              <div class="diff-side-label">Before (${hash1.substring(0, 8)})</div>
              <div class="diff-lines">
                ${lines1.map((line, i) => {
                  const isRemoved = diff.removed.some(r => r.idx === i);
                  return `<div class="diff-line ${isRemoved ? 'diff-line-removed' : 'diff-line-unchanged'}">${i + 1}  ${escapeHtml(line)}</div>`;
                }).join('')}
              </div>
            </div>
            <div class="diff-side">
              <div class="diff-side-label">After (${hash2.substring(0, 8)})</div>
              <div class="diff-lines">
                ${lines2.map((line, i) => {
                  const isAdded = diff.added.some(a => a.idx === i);
                  return `<div class="diff-line ${isAdded ? 'diff-line-added' : 'diff-line-unchanged'}">${i + 1}  ${escapeHtml(line)}</div>`;
                }).join('')}
              </div>
            </div>
          </div>
        `;

        document.getElementById('diffContent').innerHTML = diffHtml;
        addDebugLog('File diff loaded successfully', 'success');
      } catch (error) {
        addDebugLog(`Failed to load file diff: ${error.message}`, 'error');
        document.getElementById('diffContent').innerHTML = `<div style="text-align: center; padding: 40px; color: #ff5f56;">
          <p>Error: ${escapeHtml(error.message)}</p>
        </div>`;
      }
    }

    function computeDetailedDiff(lines1, lines2) {
      const added = [];
      const removed = [];
      const set1 = new Set(lines1);
      const set2 = new Set(lines2);

      lines1.forEach((line, idx) => {
        if (!set2.has(line) || (lines2[idx] !== line)) {
          removed.push({ line, idx });
        }
      });

      lines2.forEach((line, idx) => {
        if (!set1.has(line) || (lines1[idx] !== line)) {
          added.push({ line, idx });
        }
      });

      return { added, removed };
    }

    refreshData();
    setInterval(refreshData, 5000);
  </script>
  <script src="/error-handler.js"></script>
  <script>
    const errorHandler = new ErrorHandler('app-debugger');
    window.errorHandler = errorHandler;
  </script>
</body>
